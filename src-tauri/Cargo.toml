[package]
name = "openflow"
version = "0.1.0"
description = "Open-source voice transcription"
authors = ["laisyio"]
edition = "2021"

[lib]
name = "openflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(target_os = "macos")'.dependencies]
# Synthesized keystrokes carrying a unicode payload, for the "type" insert
# method. Only macOS is implemented; other platforms fall back to pasting.
core-graphics = { workspace = true }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openflow-core = { workspace = true }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
