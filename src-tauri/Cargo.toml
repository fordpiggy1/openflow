[package]
name = "openflow"
version = "0.1.0"
description = "Open-source voice transcription"
authors = ["laisyio"]
edition = "2021"

[lib]
name = "openflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Windows, tray, shortcuts and the command surface. Everything else the app does
# lives in openflow-core, so nothing here talks to audio, HTTP or sqlite.
[dependencies]
openflow-core = { workspace = true }
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-global-shortcut = "2"
