<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFlow Overlay</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; user-select: none; }

      .overlay {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: rgba(26, 19, 50, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        transition: width 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
        border: 1.5px solid rgba(255,255,255,0.08);
        position: relative;
        overflow: hidden;
      }

      .overlay:active { cursor: grabbing; }

      .overlay[data-status="recording"] {
        width: 140px;
        border-color: rgba(239, 68, 68, 0.5);
        box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
      }

      .overlay[data-status="transcribing"] {
        width: 140px;
        border-color: rgba(61, 90, 128, 0.5);
        box-shadow: 0 0 20px rgba(61, 90, 128, 0.2);
      }

      .logo {
        width: 24px;
        height: 24px;
        fill: #e8eaed;
        flex-shrink: 0;
      }

      .overlay[data-status="recording"] .logo,
      .overlay[data-status="transcribing"] .logo {
        width: 18px;
        height: 18px;
      }

      .waveform {
        display: none;
        flex: 1;
        height: 24px;
        margin-left: 8px;
        gap: 2px;
        align-items: center;
      }

      .overlay[data-status="recording"] .waveform {
        display: flex;
      }

      .wave-bar {
        width: 3px;
        background: #ef4444;
        border-radius: 2px;
        animation: wave 0.6s ease-in-out infinite alternate;
      }

      .wave-bar:nth-child(1) { animation-delay: 0s; }
      .wave-bar:nth-child(2) { animation-delay: 0.1s; }
      .wave-bar:nth-child(3) { animation-delay: 0.2s; }
      .wave-bar:nth-child(4) { animation-delay: 0.15s; }
      .wave-bar:nth-child(5) { animation-delay: 0.05s; }
      .wave-bar:nth-child(6) { animation-delay: 0.25s; }
      .wave-bar:nth-child(7) { animation-delay: 0.12s; }
      .wave-bar:nth-child(8) { animation-delay: 0.18s; }

      @keyframes wave {
        from { height: 4px; }
        to { height: 20px; }
      }

      .status-text {
        display: none;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 10px;
        font-weight: 600;
        color: rgba(255,255,255,0.6);
        margin-left: 6px;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .overlay[data-status="transcribing"] .status-text {
        display: block;
      }

      .overlay[data-status="transcribing"] .waveform {
        display: none;
      }

      .dot-pulse {
        display: none;
      }

      .overlay[data-status="transcribing"] .dot-pulse {
        display: flex;
        gap: 3px;
        margin-left: 8px;
      }

      .dot-pulse span {
        width: 5px;
        height: 5px;
        background: #7BA3C9;
        border-radius: 50%;
        animation: pulse 1s ease-in-out infinite;
      }

      .dot-pulse span:nth-child(2) { animation-delay: 0.15s; }
      .dot-pulse span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay" data-status="idle" data-tauri-drag-region>
      <svg class="logo" viewBox="0 0 24 24">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12v-2h-2z"/>
      </svg>
      <div class="waveform">
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="dot-pulse">
        <span></span><span></span><span></span>
      </div>
      <span class="status-text">Transcribing</span>
    </div>

    <script type="module">
      const { listen } = await import('https://unpkg.com/@tauri-apps/api@2/event');
      const { getCurrentWindow } = await import('https://unpkg.com/@tauri-apps/api@2/window');

      const overlay = document.getElementById('overlay');
      const win = getCurrentWindow();

      listen('recording-state', (event) => {
        const status = event.payload;
        overlay.setAttribute('data-status', status);

        if (status === 'recording' || status === 'transcribing') {
          win.setSize({ type: 'Logical', width: 148, height: 48 });
        } else {
          win.setSize({ type: 'Logical', width: 48, height: 48 });
        }
      });
    </script>
  </body>
</html>
