<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFlow Overlay</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }

      .overlay {
        width: 28px;
        height: 28px;
        background: rgba(26, 19, 50, 0.9);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: none;
        transition: width 0.2s ease, border-radius 0.2s ease,
                    border-color 0.2s ease, box-shadow 0.2s ease;
        border: 1px solid rgba(255,255,255,0.06);
        position: absolute;
        top: 0;
        left: 0;
        overflow: hidden;
        padding: 0 6px;
      }

      .overlay:active { cursor: grabbing; }

      /* Idle: no padding, just centered icon */
      .overlay[data-status="idle"] { padding: 0; }

      /* Position-based border-radius */
      .overlay[data-pos="top-left"]     { border-radius: 0 0 10px 0; }
      .overlay[data-pos="top-center"]   { border-radius: 0 0 10px 10px; }
      .overlay[data-pos="top-right"]    { border-radius: 0 0 0 10px; }
      .overlay[data-pos="left-center"]  { border-radius: 0 10px 10px 0; }
      .overlay[data-pos="right-center"] { border-radius: 10px 0 0 10px; }
      .overlay[data-pos="bottom-left"]  { border-radius: 0 10px 0 0; }
      .overlay[data-pos="bottom-center"]{ border-radius: 10px 10px 0 0; }
      .overlay[data-pos="bottom-right"] { border-radius: 10px 0 0 0; }

      /* Recording */
      .overlay[data-status="recording"] {
        width: 82px;
        justify-content: flex-start;
        border-color: rgba(239, 68, 68, 0.5);
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.2);
      }

      /* Transcribing */
      .overlay[data-status="transcribing"] {
        width: 100px;
        justify-content: flex-start;
        border-color: rgba(123, 163, 201, 0.4);
        box-shadow: 0 0 16px rgba(123, 163, 201, 0.15);
      }

      /* Logo */
      .logo {
        width: 14px;
        height: 14px;
        flex-shrink: 0;
      }
      .logo path { fill: rgba(255,255,255,0.7); }

      .overlay[data-status="recording"] .logo path { fill: #ef4444; }
      .overlay[data-status="transcribing"] .logo path { fill: #7BA3C9; }

      /* Waveform */
      .waveform {
        display: none;
        align-items: center;
        margin-left: 6px;
        gap: 2px;
        height: 18px;
      }

      .overlay[data-status="recording"] .waveform { display: flex; }

      .wave-bar {
        width: 2.5px;
        height: 4px;
        min-height: 4px;
        background: #ef4444;
        border-radius: 1.5px;
        animation: wave 0.45s ease-in-out infinite alternate;
      }
      .wave-bar:nth-child(1)  { animation-delay: 0s; }
      .wave-bar:nth-child(2)  { animation-delay: 0.07s; }
      .wave-bar:nth-child(3)  { animation-delay: 0.14s; }
      .wave-bar:nth-child(4)  { animation-delay: 0.1s; }
      .wave-bar:nth-child(5)  { animation-delay: 0.03s; }
      .wave-bar:nth-child(6)  { animation-delay: 0.18s; }
      .wave-bar:nth-child(7)  { animation-delay: 0.06s; }
      .wave-bar:nth-child(8)  { animation-delay: 0.12s; }
      .wave-bar:nth-child(9)  { animation-delay: 0.16s; }
      .wave-bar:nth-child(10) { animation-delay: 0.09s; }

      @keyframes wave {
        0%   { height: 4px; }
        100% { height: 16px; }
      }

      /* Transcribing dots */
      .dots {
        display: none;
        align-items: center;
        margin-left: 6px;
        gap: 3px;
      }
      .overlay[data-status="transcribing"] .dots { display: flex; }
      .overlay[data-status="transcribing"] .waveform { display: none; }

      .dots span {
        width: 4px; height: 4px; background: #7BA3C9;
        border-radius: 50%; animation: pulse 0.8s ease-in-out infinite;
      }
      .dots span:nth-child(2) { animation-delay: 0.15s; }
      .dots span:nth-child(3) { animation-delay: 0.3s; }

      @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 1; } }

      @media (prefers-reduced-motion: reduce) {
        .overlay, .wave-bar, .dots span { animation: none; transition: none; }
      }

      .status-label {
        display: none;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 9px;
        font-weight: 600;
        color: rgba(255,255,255,0.5);
        margin-left: 5px;
        white-space: nowrap;
        letter-spacing: 0.03em;
      }
      .overlay[data-status="transcribing"] .status-label { display: block; }

      /* Live preview: what has been heard so far, re-transcribed every tick.
         Replaced whole each time -- with more audio for context the model
         revises words it had already emitted, so an append-only view would
         show text that is no longer what it heard. */
      .preview {
        display: none;
        flex: 1;
        min-width: 0;
        margin-left: 6px;
        font-family: -apple-system, system-ui, sans-serif;
        font-size: 11px;
        line-height: 1.2;
        color: rgba(255,255,255,0.92);
        white-space: nowrap;
        overflow-x: hidden;
        /* The tail is what is being spoken now, so the start is what gets cut.
           Fading it says "there is more to the left" without a scrollbar. */
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 16px);
                mask-image: linear-gradient(to right, transparent 0, #000 16px);
      }
      .overlay[data-preview] .preview { display: block; }
      .overlay[data-status="recording"][data-preview] { width: 320px; }
      /* Held: the last line stays readable but stops tracking. Dimming it is
         the only thing separating "no longer updating" from "stopped working",
         which look identical on a line that simply sits there. */
      .overlay[data-preview="held"] .preview { opacity: 0.5; }

      /* Outcome: a moment of feedback once the text has landed, or not.
         Same 28px footprint as idle, so nothing moves on the way out. */
      .overlay[data-status="done"] {
        padding: 0;
        border-color: rgba(34, 197, 94, 0.55);
        box-shadow: 0 0 16px rgba(34, 197, 94, 0.22);
      }
      .overlay[data-status="error"] {
        padding: 0;
        border-color: rgba(239, 68, 68, 0.6);
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.25);
      }

      .badge { display: none; width: 14px; height: 14px; flex-shrink: 0; }
      .badge path { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
      .badge-done path  { stroke: #22c55e; }
      .badge-error path { stroke: #ef4444; }

      .overlay[data-status="done"]  .logo,
      .overlay[data-status="error"] .logo { display: none; }
      .overlay[data-status="done"]  .badge-done  { display: block; }
      .overlay[data-status="error"] .badge-error { display: block; }

      @media (prefers-reduced-motion: reduce) { .badge { animation: none; } }
    </style>
  </head>
  <body>
    <div class="overlay" id="overlay" data-status="idle" data-pos="left-center">
      <svg class="logo" viewBox="0 0 24 24">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3zM19 10v2a7 7 0 0 1-14 0v-2H3v2a9 9 0 0 0 8 8.94V23h2v-2.06A9 9 0 0 0 21 12v-2h-2z"/>
      </svg>
      <div class="waveform">
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
        <div class="wave-bar"></div>
      </div>
      <div class="dots"><span></span><span></span><span></span></div>
      <svg class="badge badge-done" viewBox="0 0 24 24"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
      <svg class="badge badge-error" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      <span class="preview"></span>
      <span class="status-label">...</span>
    </div>

    <script type="module">
      import { listen } from '@tauri-apps/api/event';
      import {
        LogicalSize,
        PhysicalPosition,
        currentMonitor,
        getCurrentWindow,
        primaryMonitor,
      } from '@tauri-apps/api/window';
      import { invoke } from '@tauri-apps/api/core';

      const overlay = document.getElementById('overlay');
      let position = 'left-center';
      let isDragging = false;
      let dragReady = false;
      let dragStartX, dragStartY;
      let winX = 0, winY = 0;
      let activeScale = 1;

      const POSITIONS = {
        'top-left':      { x: 0, y: 0 },
        'top-center':    { x: 0.5, y: 0 },
        'top-right':     { x: 1, y: 0 },
        'left-center':   { x: 0, y: 0.5 },
        'right-center':  { x: 1, y: 0.5 },
        'bottom-left':   { x: 0, y: 1 },
        'bottom-center': { x: 0.5, y: 1 },
        'bottom-right':  { x: 1, y: 1 },
      };

      /// Read fresh every time rather than caching: the setting then takes
      /// effect the moment it is saved, with no restart and no extra event.
      async function hideWhenIdle() {
        try {
          return (await invoke('get_setting', { key: 'overlay_only_while_recording' })) === 'true';
        } catch {
          return false;
        }
      }

      async function init() {
        const win = getCurrentWindow();

        // Visible on all Spaces
        try { await win.setVisibleOnAllWorkspaces(true); } catch {}

        try {
          const saved = await invoke('get_setting', { key: 'overlay_position' });
          if (saved && POSITIONS[saved]) position = saved;
        } catch {}

        overlay.setAttribute('data-pos', position);
        await snapToPosition(win, position, 28);

        // The window is configured visible, and only this line takes it away.
        // The reverse -- configuring it hidden and revealing it here -- would
        // mean any failure above (init runs under a catch-all) leaves the
        // overlay gone for good, turning a default setting into a dead feature.
        if (await hideWhenIdle()) await win.hide();

        // A badge outlives the "idle" that follows the result, so the outcome
        // is readable instead of a single frame. While one is up, `idle` is
        // deferred to the timer below rather than applied twice.
        // Set synchronously, before any await. The `idle` that follows the
        // result event would otherwise reach its guard while showOutcome is
        // still suspended on its first IPC call, and erase the badge.
        let badgeActive = false;
        let badgeTimer = null;

        // Live preview. Every tick re-transcribes the whole recording so far;
        // the result replaces the line rather than extending it.
        const preview = overlay.querySelector('.preview');
        const PARTIAL_MS = 800;
        const PREVIEW_WIDTH = 320;
        // A preview costs the take it is previewing: the transcriber is
        // serialized, so a key-up can land behind one still in flight. That
        // wait grows with the square of the recording -- a partial takes longer
        // the more audio it re-reads, and so is in flight a larger share of the
        // time. Measured against the LAN 0.6B it is about 40ms at 10s and
        // 220ms at 38s. Past this point the preview stops paying for itself.
        const PREVIEW_MAX_MS = 20_000;
        let partialTimer = null;
        let partialInFlight = false;
        let previewWidened = false;
        // Bumped whenever a capture ends, so a reply that was still in the air
        // cannot paint the preview of a recording that is already over.
        let captureId = 0;

        /// Stop ticking but leave the last line up. Unlike stopPartials this
        /// is not the end of a capture: the recording is still running and the
        /// text on screen is still the best guess at it.
        function holdPartials() {
          if (partialTimer) { clearInterval(partialTimer); partialTimer = null; }
          if (overlay.hasAttribute('data-preview')) {
            overlay.setAttribute('data-preview', 'held');
          }
        }

        function stopPartials() {
          captureId++;
          if (partialTimer) { clearInterval(partialTimer); partialTimer = null; }
          preview.textContent = '';
          previewWidened = false;
          overlay.removeAttribute('data-preview');
        }

        async function drawPartial() {
          // The transcriber answers one request at a time. Skipping a tick while
          // one is still out keeps the queue empty, so the take the user is
          // waiting on is not stuck behind a pile of previews they never see.
          if (partialInFlight) return;
          partialInFlight = true;
          const capture = captureId;
          try {
            const text = (await invoke('transcribe_partial') || '').trim();
            if (capture !== captureId || !text) return;
            preview.textContent = text;
            overlay.setAttribute('data-preview', partialTimer ? 'on' : 'held');
            // Re-read the status rather than trust the tick: a key-up during
            // the request would otherwise leave the wide capsule on screen
            // over a state that asked for a narrow one.
            if (!previewWidened && overlay.getAttribute('data-status') === 'recording') {
              previewWidened = true;
              await win.setSize(new LogicalSize(PREVIEW_WIDTH, 28));
              await snapToPosition(win, position, PREVIEW_WIDTH);
            }
            // Follow the newest words; the CSS fades off what scrolls past.
            preview.scrollLeft = preview.scrollWidth;
          } catch {
            // A recording that ended, too little audio yet, an endpoint that did
            // not answer: a preview is best-effort, and the real transcription
            // at key-up is unaffected by any of it.
          } finally {
            partialInFlight = false;
          }
        }

        async function startPartials() {
          stopPartials();
          const capture = captureId;
          let allowed = false;
          try { allowed = await invoke('live_preview_enabled'); } catch {}
          // The recording may already be over by the time that answers.
          if (!allowed || capture !== captureId) return;
          const startedAt = Date.now();
          partialTimer = setInterval(() => {
            // Checked before firing, not after: a request sent past the cap
            // would still be in flight to be waited on.
            if (Date.now() - startedAt >= PREVIEW_MAX_MS) holdPartials();
            else drawPartial();
          }, PARTIAL_MS);
        }

        async function settleIdle() {
          overlay.setAttribute('data-status', 'idle');
          overlay.querySelector('.status-label').textContent = '';
          await win.setSize(new LogicalSize(28, 28));
          await snapToPosition(win, position, 28);
          if (await hideWhenIdle()) await win.hide();
          else await win.show();
        }

        async function showOutcome(kind, holdMs) {
          badgeActive = true;
          if (badgeTimer) clearTimeout(badgeTimer);
          overlay.setAttribute('data-status', kind);
          overlay.querySelector('.status-label').textContent = '';
          // Same footprint as idle, so the overlay does not jump on its way out.
          await win.setSize(new LogicalSize(28, 28));
          await snapToPosition(win, position, 28);
          await win.show();
          badgeTimer = setTimeout(() => {
            badgeTimer = null;
            badgeActive = false;
            settleIdle().catch(() => {});
          }, holdMs);
        }

        await listen('recording-state', async (event) => {
          const status = event.payload;
          // Before the badge guard below returns: whatever else this event
          // means, a status that is not "recording" ends the preview loop.
          if (status === 'recording') startPartials().catch(() => {});
          else stopPartials();
          // The result event arrives just before this `idle`. Let the badge's
          // own timer close it out; clobbering it here would erase the outcome
          // in the same frame it appeared.
          if (status === 'idle' && badgeActive) return;
          if (badgeTimer) { clearTimeout(badgeTimer); badgeTimer = null; }
          badgeActive = false;
          overlay.setAttribute('data-status', status);
          overlay.querySelector('.status-label').textContent = status === 'transcribing' ? 'Working' : '';
          const w = status === 'recording' ? 82 : status === 'transcribing' ? 100 : 28;
          await win.setSize(new LogicalSize(w, 28));
          await snapToPosition(win, position, w);
          // Size and position first, then reveal: showing before the resize
          // lands would flash the idle width at the recording moment.
          if (await hideWhenIdle()) {
            if (status === 'idle') await win.hide();
            else await win.show();
          } else {
            await win.show();
          }
        });

        // Both events already existed for the settings window; the overlay just
        // never listened. Failure gets the longer hold -- it is the one worth
        // catching, and the text is still on the clipboard either way.
        await listen('transcription-result', () => { showOutcome('done', 1200).catch(() => {}); });
        await listen('transcription-error',  () => { showOutcome('error', 2200).catch(() => {}); });

        overlay.addEventListener('pointerdown', async (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          isDragging = true;
          dragReady = false;
          overlay.setPointerCapture(e.pointerId);
          dragStartX = e.screenX;
          dragStartY = e.screenY;
          overlay.style.cursor = 'grabbing';

          const [origin, monitor] = await Promise.all([win.outerPosition(), getActiveMonitor()]);
          if (!isDragging) return;
          winX = origin.x;
          winY = origin.y;
          activeScale = monitor?.scaleFactor || await win.scaleFactor();
          dragReady = true;
        });

        overlay.addEventListener('pointermove', (e) => {
          if (!isDragging || !dragReady) return;
          const dx = (e.screenX - dragStartX) * activeScale;
          const dy = (e.screenY - dragStartY) * activeScale;
          winX += dx;
          winY += dy;
          dragStartX = e.screenX;
          dragStartY = e.screenY;
          win.setPosition(new PhysicalPosition(Math.round(winX), Math.round(winY)));
        });

        const finishDrag = async (e) => {
          if (!isDragging) return;
          isDragging = false;
          dragReady = false;
          if (overlay.hasPointerCapture(e.pointerId)) overlay.releasePointerCapture(e.pointerId);
          overlay.style.cursor = 'grab';

          const monitor = await getActiveMonitor();
          if (!monitor) return;
          const actualPosition = await win.outerPosition();
          const curW = getWidth();
          const physicalWidth = curW * monitor.scaleFactor;
          const physicalHeight = 28 * monitor.scaleFactor;
          const area = monitor.workArea;
          const px = (actualPosition.x - area.position.x) / Math.max(area.size.width - physicalWidth, 1);
          const py = (actualPosition.y - area.position.y) / Math.max(area.size.height - physicalHeight, 1);

          let nearest = 'left-center';
          let minDist = Infinity;
          for (const [name, coords] of Object.entries(POSITIONS)) {
            const dist = Math.hypot(px - coords.x, py - coords.y);
            if (dist < minDist) { minDist = dist; nearest = name; }
          }

          position = nearest;
          overlay.setAttribute('data-pos', position);
          await snapToPosition(win, position, curW, monitor);
          invoke('set_setting', { key: 'overlay_position', value: position }).catch(() => {});
        };

        overlay.addEventListener('pointerup', finishDrag);
        overlay.addEventListener('pointercancel', finishDrag);
      }

      function getWidth() {
        const s = overlay.getAttribute('data-status');
        return s === 'recording' ? 82 : s === 'transcribing' ? 72 : 28;
      }

      async function getActiveMonitor() {
        return await currentMonitor() || await primaryMonitor();
      }

      async function snapToPosition(win, pos, w, selectedMonitor) {
        const monitor = selectedMonitor || await getActiveMonitor();
        if (!monitor) return;
        const coords = POSITIONS[pos];
        const physicalWidth = w * monitor.scaleFactor;
        const physicalHeight = 28 * monitor.scaleFactor;
        const area = monitor.workArea;
        const x = area.position.x + Math.round(coords.x * (area.size.width - physicalWidth));
        const y = area.position.y + Math.round(coords.y * (area.size.height - physicalHeight));
        await win.setPosition(new PhysicalPosition(x, y));
      }

      init().catch(() => {});
    </script>
  </body>
</html>
